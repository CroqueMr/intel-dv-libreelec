name: Playback or hardware report
description: Report a reproducible issue or a newly tested Intel device.
body:
  - type: input
    id: release
    attributes:
      label: Release and image SHA-256
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and HDMI route
      description: CPU, GPU/driver, mini-PC or motherboard, TV/firmware, direct HDMI or adapter/receiver.
    validations:
      required: true
  - type: textarea
    id: stream
    attributes:
      label: Stream and behavior
      description: Profile, codec, resolution, frame rate, CM generation, subtitles; expected versus actual behavior and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Distinguish startup/seek changes from steady playback. Remove credentials, personal paths, network addresses and media titles from logs. Do not upload movies or proprietary SDKs.
